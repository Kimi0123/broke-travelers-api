name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_local_dev_secret
          POSTGRES_DB: broke_travelers
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Initialize roles and databases
        env:
          PGPASSWORD: postgres_local_dev_secret
        run: |
          psql -h localhost -p 5432 -U postgres -d broke_travelers -f docker/initdb/01-roles.sql

      - name: Run migrations on test database
        env:
          DATABASE_URL: postgresql://migration_owner:migration_owner_local_dev_secret@localhost:5432/broke_travelers_test?schema=public
        run: npm run db:migrate

      - name: Run integration tests
        env:
          NODE_ENV: test
          PORT: 3000
          LOG_LEVEL: silent
          REQUIRE_VERIFIED_EMAIL: 'false'
          FIREBASE_PROJECT_ID: broke-travelers-test
          DATABASE_URL: postgresql://api_user:api_user_local_dev_secret@localhost:5432/broke_travelers_test?schema=public
          TEST_DATABASE_URL: postgresql://api_user:api_user_local_dev_secret@localhost:5432/broke_travelers_test?schema=public
          TEST_DIRECT_URL: postgresql://migration_owner:migration_owner_local_dev_secret@localhost:5432/broke_travelers_test?schema=public
        run: npm run test:integration
