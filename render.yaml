services:
  - type: web
    name: broke-travelers-api
    runtime: node
    autoDeploy: false
    # Preferred Region: Singapore (singapore) or Mumbai (ap-south-1) for lowest latency to Nepal
    region: singapore
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: REQUIRE_VERIFIED_EMAIL
        value: 'true'
      - key: LOG_LEVEL
        value: info
